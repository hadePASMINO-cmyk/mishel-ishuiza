<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso privado | Mishel Pasmiño</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,400&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--noche:#0f2826;--tinta:#14312f;--texto:#4a5b59;--verde:#2c7a72;--rosa:#d4486f;--rosa-claro:#f4a3b9;--oro:#c9a27a;--marfil:#faf6f2;--linea:#e8ddd4;--serif:"Fraunces",Georgia,serif;--sans:"Figtree","Segoe UI",Arial,sans-serif;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;font-family:var(--sans);color:var(--tinta);background:var(--marfil)}
:focus-visible{outline:3px solid var(--rosa);outline-offset:3px;border-radius:8px}
.lado{position:relative;overflow:hidden;color:#eaf3f1;padding:56px 56px 64px;display:flex;flex-direction:column;justify-content:space-between;
  background:radial-gradient(70% 55% at 85% 15%,#d4486f3a,transparent 70%),radial-gradient(60% 50% at 0 100%,#2c7a7266,transparent 70%),var(--noche)}
.lado small{font-size:15px;color:#9fc7c1;max-width:32ch;display:block;opacity:0;animation:entra 1s var(--ease) .2s forwards}
.lado h1{font:600 clamp(46px,6vw,92px)/1 var(--serif);letter-spacing:-.02em;margin:0;opacity:0;animation:entra 1.1s var(--ease) .4s forwards}
.lado h1 span{display:block;font-style:italic;font-weight:400;color:var(--rosa-claro)}
.ecg{width:100%;max-width:560px;height:80px;margin-top:34px}
.ecg path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.ecg .base{stroke:#ffffff1f;stroke-width:1.5}
.ecg .pulso{stroke:var(--rosa);stroke-width:3;stroke-dasharray:.16 1;stroke-dashoffset:.16;filter:drop-shadow(0 0 6px var(--rosa));animation:viaja 4.2s linear .8s infinite}
@keyframes viaja{to{stroke-dashoffset:-1}}
@keyframes entra{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.form-lado{display:grid;place-items:center;padding:32px}
form{width:100%;max-width:400px;opacity:0;animation:entra 1s var(--ease) .5s forwards}
h2{font:600 40px/1.1 var(--serif);margin:0 0 8px;letter-spacing:-.01em}
.sub{margin:0 0 28px;color:var(--texto)}
label{display:block;font-weight:600;font-size:14px;margin:20px 0 8px}
input{width:100%;padding:15px 18px;border:1.5px solid var(--linea);border-radius:14px;font:400 16px var(--sans);color:var(--tinta);background:#fff;transition:border-color .3s,box-shadow .3s,transform .3s var(--ease)}
input:hover{border-color:#cdbfb3}
input:focus{outline:none;border-color:var(--verde);box-shadow:0 0 0 5px #2c7a7222;transform:translateY(-1px)}
button{position:relative;overflow:hidden;width:100%;margin-top:28px;padding:16px;border:0;border-radius:14px;background:var(--tinta);color:#fff;font:600 16px var(--sans);cursor:pointer;box-shadow:0 14px 28px #14312f30;transition:transform .3s var(--ease),box-shadow .3s}
button::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,var(--rosa),#e06a8d);transform:translateX(-101%);transition:transform .5s var(--ease)}
button:hover::before{transform:none}
button:hover{transform:translateY(-2px);box-shadow:0 18px 34px #d4486f40}
button:active{transform:scale(.99)}
button:disabled{opacity:.7;cursor:wait}
button:disabled::before{transform:none;animation:carga 1.2s ease-in-out infinite alternate}
@keyframes carga{to{opacity:.55}}
button span,button{z-index:0}
#error{min-height:22px;margin:14px 0 0;color:#b3234d;font-weight:600;font-size:14px}
#error:not(:empty){animation:sacude .4s}
@keyframes sacude{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.volver{display:inline-block;margin-top:16px;color:var(--verde);font-weight:600;text-decoration:none;position:relative}
.volver::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1.5px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease)}
.volver:hover::after{transform:scaleX(1)}
@media(max-width:820px){body{grid-template-columns:1fr}.lado{padding:36px 26px;gap:26px}.ecg{height:56px;margin-top:14px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}.lado small,.lado h1,form{opacity:1}}
.lado::before,.lado::after{content:"";position:absolute;border-radius:50%;filter:blur(50px);pointer-events:none;animation:deriva 11s ease-in-out infinite}
.lado::before{width:340px;height:340px;background:#d4486f44;right:-90px;top:-80px}
.lado::after{width:380px;height:380px;background:#2c7a7255;left:-110px;bottom:-100px;animation-delay:-5s}
@keyframes deriva{50%{transform:translate(40px,30px) scale(1.12)}}
.lado>*{position:relative;z-index:1}
.lado .particulas{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.particulas b{position:absolute;bottom:-20px;width:var(--s);height:var(--s);border-radius:50%;background:var(--c);opacity:0;animation:asciende var(--d) linear var(--t) infinite}
@keyframes asciende{0%{transform:translate(0,0);opacity:0}12%{opacity:.7}88%{opacity:.4}100%{transform:translate(var(--x),-105vh);opacity:0}}
.lado h1{background:linear-gradient(100deg,#eaf3f1 40%,#fff 50%,#eaf3f1 60%);background-size:240% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:entra 1.1s var(--ease) .4s forwards,brillo 6s ease-in-out 2s infinite}
.lado h1 span{-webkit-text-fill-color:var(--rosa-claro)}
@keyframes brillo{0%,100%{background-position:100% 0}50%{background-position:0 0}}
form h2,.sub,label,input,.volver{opacity:0;animation:entra .8s var(--ease) forwards}
form h2{animation-delay:.6s}.sub{animation-delay:.7s}label:nth-of-type(1){animation-delay:.8s}#usuario{animation-delay:.85s}label:nth-of-type(2){animation-delay:.95s}#clave{animation-delay:1s}.volver{animation-delay:1.2s}
button{opacity:0;animation:entra .8s var(--ease) 1.1s forwards}
@media(prefers-reduced-motion:reduce){.lado .particulas{display:none}form h2,.sub,label,input,.volver,button{opacity:1}}

.password-wrap{position:relative}
.password-wrap input{padding-right:88px}
.toggle-pass{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:auto;margin:0;padding:8px 10px;background:transparent;color:var(--verde);box-shadow:none;font-size:13px}
.toggle-pass::before{display:none}
.toggle-pass:hover{transform:translateY(-50%);background:var(--menta);box-shadow:none;color:var(--tinta)}
.form-lado{background:radial-gradient(ellipse at 85% 10%,#dcefeb80,transparent 42%),var(--marfil)}
form{background:#ffffffc9;border:1px solid #e8ddd4;border-radius:24px;padding:clamp(26px,4vw,42px);box-shadow:0 24px 70px #14312f12;backdrop-filter:blur(12px)}
input{background:#fff}
.sub{line-height:1.6}
@media(max-width:820px){body{min-height:100svh}.lado{min-height:330px}.form-lado{padding:26px 18px 42px}}
@media(max-width:480px){.lado{min-height:280px;padding:28px 24px}.lado h1{font-size:clamp(40px,11vw,58px)}form{padding:25px 20px}}
</style>
</head>
<body>
<section class="lado">
  <div class="particulas" aria-hidden="true"></div>
  <small>Panel privado del portafolio de Ética y Deontología en Enfermería</small>
  <div>
    <h1>Mishel <span>Pasmiño Ishuiza</span></h1>
    <svg class="ecg" viewBox="0 0 560 80" aria-hidden="true"><path class="base" d="M0 44 H190 L208 44 L224 14 L244 72 L264 6 L284 62 L300 44 H560"/><path class="pulso" pathLength="1" d="M0 44 H190 L208 44 L224 14 L244 72 L264 6 L284 62 L300 44 H560"/></svg>
  </div>
</section>
<section class="form-lado">
  <form id="form-login">
    <h2>Iniciar sesión</h2>
    <p class="sub">Accede de forma segura para administrar tu portafolio académico.</p>
    <label for="usuario">Usuario</label>
    <input id="usuario" name="username" required autocomplete="username" placeholder="Ingresa tu usuario" value="">
    <label for="clave">Contraseña</label>
    <div class="password-wrap"><input id="clave" name="password" type="password" required autocomplete="current-password" placeholder="Ingresa tu contraseña"><button class="toggle-pass" type="button" id="ver-clave" aria-label="Mostrar contraseña" aria-pressed="false">Mostrar</button></div>
    <button type="submit" id="btn">Entrar al panel</button>
    <p id="error" aria-live="polite"></p>
    <a class="volver" href="index.html">Volver al portafolio</a>
  </form>
</section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(function(){
  const errorBox=document.getElementById("error");
  const form=document.getElementById("form-login");
  const btn=document.getElementById("btn");
  const password=document.getElementById("clave");
  const toggle=document.getElementById("ver-clave");
  toggle.addEventListener("click",()=>{
    const visible=password.type==="password";
    password.type=visible?"text":"password";
    toggle.textContent=visible?"Ocultar":"Mostrar";
    toggle.setAttribute("aria-pressed",String(visible));
    toggle.setAttribute("aria-label",visible?"Ocultar contraseña":"Mostrar contraseña");
  });
  function config(){
    const c=window.PORTAFOLIO;
    if(!window.supabase||!c||!c.SUPABASE_URL||!c.SUPABASE_KEY||!c.ADMIN_EMAIL||!c.ADMIN_USUARIO){
      throw new Error("Falta configurar config.js con las credenciales del proyecto.");
    }
    return c;
  }
  let C,sb;
  try{C=config();sb=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_KEY);
    sb.auth.getSession().then(({data})=>{
      if(data.session&&data.session.user.email===C.ADMIN_EMAIL)location.replace("panel-admin.html");
    });
  }catch(e){errorBox.textContent=e.message;btn.disabled=true;}
  form.addEventListener("submit",async e=>{
    e.preventDefault();
    if(!sb)return;
    const user=document.getElementById("usuario").value.trim().toLowerCase();
    const pass=password.value;
    errorBox.textContent="";
    if(user!==String(C.ADMIN_USUARIO).trim().toLowerCase()&&user!==C.ADMIN_EMAIL.toLowerCase()){
      errorBox.textContent="Usuario o contraseña incorrectos.";return;
    }
    btn.disabled=true;btn.textContent="Verificando acceso…";
    try{
      const {data,error}=await sb.auth.signInWithPassword({email:C.ADMIN_EMAIL,password:pass});
      if(error)throw error;
      if(!data.user||data.user.email!==C.ADMIN_EMAIL)throw new Error("Cuenta no autorizada");
      location.href="panel-admin.html";
    }catch(err){
      console.error(err);errorBox.textContent="Usuario o contraseña incorrectos.";
      btn.disabled=false;btn.textContent="Entrar al panel";
    }
  });
})();
</script>

</body>
</html>
